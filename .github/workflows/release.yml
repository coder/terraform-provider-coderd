name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  goreleaser:
    # coder/terraform-provider-coder holds the one copy of the steps that sign a Coder provider
    # release. coder/gcp only lets main's copy act as the signer, so a tag chooses the commit to
    # release, but not the steps that sign it. It refuses to release unless the Cloud KMS key
    # matches .github/release-signing-key.asc, the key the Terraform Registry has.
    uses: coder/terraform-provider-coder/.github/workflows/release-sign.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # workload identity federation to the Cloud KMS signing key
